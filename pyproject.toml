[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-lab"
version = "0.1.0"
description = "Phase 1 safety foundation for a simulated quantitative research lab"
requires-python = ">=3.12"
dependencies = [
    "smartapi-python>=1.3.1",
    "pyotp>=2.9.0",
    "google-genai>=0.2.2",
    "python-dotenv>=1.0.0",
    "logzero>=1.7.0",
    "websocket-client>=1.7.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["trading_lab*"]
